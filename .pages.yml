# Pages CMS 설정 (https://app.pagescms.org)
# 운영자는 웹 브라우저에서 글 작성, 소개 페이지 편집, 디자인 테마·이벤트 배너 변경을 모두 클릭만으로 할 수 있습니다.

media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  rename: safe

content:
  # ───────────────────────────────────────────────────────────
  # 0. ✨ 카페 글 올리기 (가장 많이 쓰는 메뉴)
  #    카페 글 주소 + 본문 붙여넣기 → 저장하면, AI가 제목·3줄 요약·개인정보 가림을
  #    처리해 1~2분 뒤 사이트에 자동 발행합니다. (scripts/process-inbox.mjs)
  # ───────────────────────────────────────────────────────────
  - name: inbox
    label: ✨ 카페 글 올리기 (붙여넣기만 하면 AI가 정리)
    type: collection
    path: src/inbox
    format: yaml-frontmatter
    exclude: [.gitkeep]
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.md"
      field: false
    view:
      fields: [title, originalUrl, aiStatus]
      primary: originalUrl
      default:
        sort: originalUrl
        order: desc
    fields:
      - name: originalUrl
        label: ① 카페 글 주소
        type: string
        required: true
        description: "네이버 카페에서 글을 열고 주소창의 주소를 복사해 붙여 넣으세요. 예) https://cafe.naver.com/wooseongapt/551864 · 같은 주소로 다시 올리면 기존 글이 새 내용으로 바뀝니다."
      - name: body
        label: ② 카페 글 내용 붙여넣기 (사진 포함)
        type: rich-text
        required: true
        description: "카페 글 본문을 마우스로 드래그하거나 Ctrl+A로 선택해 복사(Ctrl+C)한 뒤 여기에 붙여 넣으세요(Ctrl+V). 글 속 사진도 함께 붙여 넣으면 저장할 때 자동으로 내려받아 같은 위치에 넣어 줍니다. 회원 이름·전화번호·계좌번호는 AI가 자동으로 가립니다."
        options:
          format: markdown
          path: public/images/uploads
      - name: photos
        label: ③ 사진 추가 (선택, 최대 5장)
        type: image
        description: 붙여 넣기로 사진이 안 들어갔을 때 여기서 직접 올리세요. 첫 번째 사진이 대표 사진(썸네일)이 됩니다. 사진이 하나도 없으면 기본 일러스트가 나옵니다.
        options:
          multiple:
            max: 5
      - name: title
        label: 제목 (선택 — 비워 두면 AI가 검색에 잘 걸리는 제목을 지어 줍니다)
        type: string
      - name: category
        label: 카테고리
        type: select
        default: auto
        options:
          values:
            - name: auto
              label: 🤖 AI가 알아서 선택
            - name: 공지사항
              label: 공지사항
            - name: 모임·행사
              label: 모임·행사
            - name: 동네 소식
              label: 동네 소식
            - name: 생활 정보
              label: 생활 정보
            - name: 맛집·카페
              label: 맛집·카페
      - name: pinned
        label: 📌 메인 화면 맨 위에 고정
        type: boolean
        default: false
      - name: publish
        label: 공개 방식
        type: select
        default: now
        options:
          values:
            - name: now
              label: 바로 사이트에 공개
            - name: review
              label: 비공개로 저장 (내용 확인 후 '발행된 글 관리'에서 직접 공개)
      - name: pubDate
        label: 작성일
        type: date
        options:
          format: yyyy-MM-dd
      - name: aiStatus
        label: 처리 상태 (자동 표시)
        type: string
        readonly: true
        description: 저장 후 1~2분이면 이 항목은 목록에서 사라지고 사이트에 글이 올라갑니다. 문제가 생기면 여기에 이유가 표시됩니다.

  # ───────────────────────────────────────────────────────────
  # 1. 발행된 글 관리 (수정·고정·비공개 전환, 직접 작성)
  # ───────────────────────────────────────────────────────────
  - name: posts
    label: 📚 발행된 글 관리 (수정·고정·비공개, 직접 작성)
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-post-{hour}{minute}.md"
      field: false
    view:
      fields: [title, pinned, category, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      search: [title, summary]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
        description: 외부 사람이 검색할 법한 문장으로 쓰면 AI 검색 노출에 유리합니다. 예) 신도림 도림천 송년 산책 모임 안내
      - name: pinned
        label: 상단 고정 (📌 중요 안내)
        type: boolean
        default: false
        description: 켜면 메인 화면 맨 위 '중요 안내' 영역에 항상 보입니다.
      - name: pubDate
        label: 작성일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 카테고리
        type: select
        required: true
        default: 공지사항
        options:
          values: [공지사항, 모임·행사, 동네 소식, 생활 정보, 맛집·카페]
      - name: summary
        label: 3줄 요약
        type: text
        required: true
        description: 글의 핵심을 3문장으로 적어 주세요. 상세 페이지 상단 요약 상자와 검색엔진 설명에 쓰입니다.
      - name: thumbnail
        label: 대표 썸네일
        type: image
        description: 비워 두면 카테고리별 기본 일러스트가 자동으로 표시됩니다.
      - name: originalUrl
        label: 카페 원문 URL
        type: string
        description: 네이버 카페 원문 글 주소. 상세 페이지 하단 '댓글로 함께하기' 버튼이 이 주소로 연결됩니다.
      - name: draft
        label: 비공개 (임시 저장)
        type: boolean
        default: false
        description: 켜 두면 사이트에 공개되지 않습니다.
      - name: publishedAt
        label: 발행 시각 (자동 기록, 같은 날 글의 순서용)
        type: string
        hidden: true
      - name: eventDate
        label: 📅 행사 날짜 (선택 — 행사일·접수 마감일 등, 비우면 행사 아님)
        type: date
        default: ""
        description: '카페 글 올리기로 올리면 AI가 원문에서 자동으로 채웁니다. 틀렸으면 여기서 고치세요. 다가오는 행사순 정렬과 D-day 표시에 쓰입니다.'
        options:
          format: yyyy-MM-dd
      - name: eventEndDate
        label: 📅 행사 종료일 (선택 — 기간이 있을 때만)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: eventLabel
        label: 행사 날짜 이름 (예 행사일, 접수 마감, 이벤트 기간)
        type: string
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown

  # ───────────────────────────────────────────────────────────
  # 2. 커뮤니티 소개 (/about)
  # ───────────────────────────────────────────────────────────
  - name: aboutPage
    label: 🏡 커뮤니티 소개 페이지 (/about) 편집
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: introTitle
        label: 소개 제목
        type: string
        required: true
      - name: introLead
        label: 한 줄 정의 (AI가 가장 먼저 읽는 문장)
        type: text
        required: true
        description: "'신도림 커뮤니티는 ~입니다' 형태로 쓰면 AI 검색 답변에 그대로 인용되기 좋습니다."
      - name: introBody
        label: 상세 본문
        type: text
        description: 문단을 나누려면 빈 줄을 하나 넣으세요.
      - name: coreValues
        label: 핵심 활동 목록
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 활동 이름
            type: string
          - name: description
            label: 설명
            type: text
      - name: milestones
        label: 주요 연혁
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{period} · {event}"
        fields:
          - name: period
            label: 시기 (예 2024년 3월)
            type: string
          - name: event
            label: 내용
            type: text
      - name: faqs
        label: 자주 묻는 질문 (FAQ)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: 질문
            type: string
          - name: answer
            label: 답변
            type: text
      - name: locationInfo
        label: 활동 지역
        type: string
        default: 서울특별시 구로구 신도림동 일대

  # ───────────────────────────────────────────────────────────
  # 3. 사이트 디자인 테마 · 이벤트 배너 · 기본 설정
  # ───────────────────────────────────────────────────────────
  - name: siteConfig
    label: 🎨 디자인 테마 · 이벤트 배너 · 기본 설정
    type: file
    path: src/data/siteConfig.json
    format: json
    fields:
      - name: design
        label: 🎨 디자인 테마
        type: object
        fields:
          - name: themePreset
            label: 컬러 테마 (계절·행사 분위기)
            type: select
            default: sage
            options:
              values:
                - name: sage
                  label: 도림천 세이지 (기본)
                - name: blossom
                  label: 봄날 벚꽃 웜톤
                - name: terracotta
                  label: 가을 브런치 테라코타
                - name: winter-navy
                  label: 연말 네이비 골드
                - name: minimal-mono
                  label: 모던 미니멀 모노톤
          - name: heroStyle
            label: 메인 상단 배너 스타일
            type: select
            default: magazine-card
            options:
              values:
                - name: magazine-card
                  label: 감성 카드형 (기본)
                - name: full-visual
                  label: 와이드 이미지 강조형 (축제·이벤트)
                - name: minimal-typo
                  label: 미니멀 글자형 (이미지 없음)
          - name: headingFont
            label: 제목 서체 (모두 무료 OFL 폰트)
            type: select
            default: serif
            description: 사이트 제목·글 제목에 쓰이는 서체입니다. 바꾼 뒤 1~2분 후 Ctrl+F5로 확인하세요.
            options:
              values:
                - name: serif
                  label: 고운바탕 — 따뜻한 감성 명조 (기본)
                - name: myeongjo
                  label: 나눔명조 — 단정한 잡지 명조
                - name: noto-serif
                  label: 노토 세리프 — 또렷하고 우아한 명조
                - name: hahmlet
                  label: 함렛 — 현대적이고 세련된 명조
                - name: songmyung
                  label: 송명 — 붓글씨 느낌의 고풍스러운 명조
                - name: diphylleia
                  label: 디필레아 — 가늘고 우아한 장식 명조
                - name: sans
                  label: 프리텐다드 — 깔끔한 모던 고딕
                - name: dodum
                  label: 고운돋움 — 부드럽고 둥근 고딕
                - name: pen
                  label: 나눔손글씨 펜 — 정겨운 손글씨
          - name: bodyFont
            label: 본문 서체 (모두 무료 OFL 폰트)
            type: select
            default: pretendard
            description: 글 본문·설명 문장에 쓰이는 서체입니다. 긴 글은 읽기 편한 고딕을 권합니다.
            options:
              values:
                - name: pretendard
                  label: 프리텐다드 — 깔끔하고 읽기 편한 고딕 (기본)
                - name: dodum
                  label: 고운돋움 — 부드럽고 따뜻한 고딕
                - name: noto-sans
                  label: 노토 산스 — 표준적이고 또렷한 고딕
                - name: plex
                  label: IBM Plex Sans KR — 단정한 정보형 고딕
                - name: myeongjo
                  label: 나눔명조 — 브런치 에세이 같은 명조 본문
          - name: defaultViewMode
            label: 첫 화면 글 목록 보기 방식
            type: select
            default: grid
            options:
              values:
                - name: grid
                  label: 포토 그리드 (인스타그램형)
                - name: list
                  label: 에세이 리스트 (브런치형)
          - name: defaultSort
            label: 첫 화면 글 정렬 순서
            type: select
            default: newest
            options:
              values:
                - name: newest
                  label: 최신순 (기본)
                - name: event
                  label: 다가오는 행사순 (행사 날짜가 가까운 글부터)
                - name: oldest
                  label: 오래된순
                - name: title
                  label: 제목 가나다순

      - name: eventBanner
        label: 📣 특별 이벤트 상단 배너
        type: object
        fields:
          - name: enabled
            label: 배너 켜기
            type: boolean
            default: false
          - name: badge
            label: 배지 문구 (예 EVENT, 공지, D-7)
            type: string
            default: EVENT
          - name: text
            label: 안내 문구
            type: string
          - name: linkText
            label: 버튼 텍스트
            type: string
            default: 자세히 보기
          - name: linkUrl
            label: 이동 링크 (사이트 내부는 /about 처럼, 외부는 https:// 로 시작)
            type: string

      - name: siteTitle
        label: 사이트 이름
        type: string
        required: true
      - name: siteDescription
        label: 사이트 설명 (검색 결과에 표시)
        type: text
      - name: representativeName
        label: 운영진 표기명
        type: string
        default: 신도림 커뮤니티 운영진
      - name: heroTitle
        label: 메인 배너 제목 (줄바꿈 가능)
        type: text
      - name: heroSubtitle
        label: 메인 배너 부제목
        type: text
      - name: heroImage
        label: 메인 배너 이미지
        type: image
      - name: cafeUrl
        label: 네이버 카페 주소 (https://cafe.naver.com/...)
        type: string
      - name: indexNowKey
        label: IndexNow 키 (GitHub Secrets에 등록했다면 비워 두세요)
        type: string
      - name: categories
        label: 카테고리 목록 (메인 화면 탭 순서)
        type: string
        list: true
        description: 새 카테고리를 추가하면 글 작성 화면의 카테고리 목록에도 같은 이름이 있어야 선택할 수 있습니다. (운영 매뉴얼 참고)
      - name: navigation
        label: 상단 메뉴
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: 메뉴 이름
            type: string
          - name: url
            label: 링크 (/about 또는 https://...)
            type: string
      - name: footerText
        label: 하단 안내 문구
        type: text
