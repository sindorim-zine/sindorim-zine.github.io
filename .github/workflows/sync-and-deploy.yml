name: Publish & Deploy

on:
  # Pages CMS에서 저장하면(카페 글 올리기·글 수정·디자인 변경) 바로 실행
  push:
    branches: [main]
  # 매일 한국시간 오전 8시 (UTC 23:00): 실패했던 '카페 글 올리기' 항목 자동 재시도
  schedule:
    - cron: '0 23 * * *'
  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # 용량 700MB 초과 시 알림 이슈 등록

concurrency:
  group: publish-and-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || vars.INDEXNOW_KEY }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      # ── ✨ 카페 글 올리기: 붙여 넣은 글을 AI로 정리해 게시글로 발행 ─────────
      - name: 카페 글 AI 정리 (받아쓰기 → 게시글)
        id: inbox
        env:
          # GEMINI_API_KEY 또는 GEMINIAPI_KEY 어느 이름으로 등록해도 동작합니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPI_KEY }}
        run: node scripts/process-inbox.mjs

      # ── 사진 자동 압축: CMS로 직접 올린 사진까지 폭 1600px·JPEG/WebP로 줄이고 경로를 고침 ──
      - name: 사진 자동 압축
        run: node scripts/optimize-images.mjs

      - name: 정리된 글·압축한 사진 커밋 & 푸시
        run: |
          git add -A src/content/posts src/inbox src/data public/images/uploads
          if git diff --cached --quiet; then
            echo "새로 정리된 글이나 압축할 사진이 없습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(inbox): 카페 글 AI 정리·사진 압축"
            # 기본 GITHUB_TOKEN으로 푸시하므로 이 푸시는 워크플로를 다시 실행하지 않습니다(무한 루프 방지).
            git pull --rebase --autostash origin main || true
            git push || echo "푸시 실패: 이번 배포에는 새 글이 포함되며, 다음 실행 때 다시 커밋됩니다."
          fi

      # ── 빌드 → 검색 색인 → 배포 ────────────────────────────────────────────
      - name: Astro 빌드 + Pagefind 검색 색인
        run: |
          npx astro build
          npx pagefind --site dist

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pages 배포
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # GitHub 쪽 일시 오류("No artifacts named github-pages")가 가끔 생겨, 20초 뒤 한 번 더 배포합니다.
      - name: 배포 재시도 대기
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: GitHub Pages 배포 (재시도)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # ── 배포 후: 새 글·수정된 글을 IndexNow로 즉시 알림 ───────────────────
      - name: IndexNow 핑
        run: node scripts/indexnow-ping.mjs --changed

      # ── 용량 점검: 700MB를 넘으면 '[용량 알림]' 이슈 등록 → GitHub가 이메일로 알림 ──
      - name: 용량 점검
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 기본 기준 700MB. 바꾸려면 저장소 Settings → Variables에 STORAGE_WARN_MB(숫자, MB)를 등록하세요.
          STORAGE_WARN_MB: ${{ vars.STORAGE_WARN_MB }}
        run: node scripts/check-storage.mjs
